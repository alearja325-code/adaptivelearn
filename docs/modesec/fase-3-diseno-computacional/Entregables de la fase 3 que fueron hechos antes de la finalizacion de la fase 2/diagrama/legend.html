<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Notación empleada</title>
<style>
  body { margin:0; padding:40px; background:#FFFFFF; font-family:Helvetica,Arial,sans-serif; }
  h1 { font-size:20px; color:#111111; margin:0 0 4px 0; }
  p.sub { font-size:13px; color:#555555; margin:0 0 32px 0; }
  .bloque { margin-bottom: 32px; }
  p.caption { font-size:13px; color:#555555; margin:8px 4px 0 4px; }
  svg { display:block; }
</style></head><body>
<h1>Notación empleada</h1><p class="sub">Los símbolos usados en los 6 bloques, con su significado.</p>
<div class="bloque"><svg xmlns="http://www.w3.org/2000/svg" width="1250" height="370" viewBox="0 0 1250 370" font-family="Helvetica">
<rect x="0" y="0" width="1250" height="370" fill="#F3F5F8" rx="20" ry="20" stroke="#E3E7ED"/>
<rect x="80.0" y="40.0" width="180" height="60" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="170" y="75" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#111111">Entidad</text>
<text x="170" y="118" text-anchor="middle" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Rectángulo</text>
<text x="170" y="138" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">Un objeto que se guarda</text>
<text x="170" y="154" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">(Docente, Experiencia...).</text>
<polygon points="470,35.0 535.0,70 470,105.0 405.0,70" fill="#DCE8FA" stroke="#3B7DD8" stroke-width="1.5"/>
<text x="470" y="74" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#1C3A5E">relación</text>
<text x="470" y="118" text-anchor="middle" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Rombo</text>
<text x="470" y="138" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">Cómo se conectan dos</text>
<text x="470" y="154" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">entidades (crea, tiene...).</text>
<ellipse cx="770" cy="70" rx="55.0" ry="20.0" fill="#FFFFFF" stroke="#888888" stroke-width="1"/>
<text x="770" y="74" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#111111">atributo</text>
<text x="770" y="118" text-anchor="middle" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Elipse blanca</text>
<text x="770" y="138" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">Un dato / campo de</text>
<text x="770" y="154" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">la entidad.</text>
<ellipse cx="1070" cy="70" rx="55.0" ry="20.0" fill="#111111" stroke="#111111" stroke-width="1"/>
<text x="1070" y="74" text-anchor="middle" font-family="Helvetica" font-size="12.5" fill="#FFFFFF">id (PK)</text>
<text x="1070" y="118" text-anchor="middle" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Elipse negra</text>
<text x="1070" y="138" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">El identificador único</text>
<text x="1070" y="154" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">de la entidad.</text>
<rect x="75.0" y="225.0" width="190" height="70" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="80.0" y="230.0" width="180" height="60" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="170" y="265" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#111111">Entidad débil</text>
<text x="170" y="308" text-anchor="middle" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Doble borde</text>
<text x="170" y="328" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">Depende de otras para</text>
<text x="170" y="344" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">existir, sin id propio (Resultado).</text>
<rect x="380.0" y="230.0" width="180" height="60" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-dasharray="6,5"/>
<text x="470" y="265" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#111111">Vista calculada</text>
<text x="470" y="308" text-anchor="middle" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Borde punteado</text>
<text x="470" y="328" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">No es tabla: se calcula</text>
<text x="470" y="344" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">al consultar (Reporte).</text>
<rect x="680.0" y="230.0" width="180" height="60" fill="#F5F3EE" stroke="#111111" stroke-width="2"/>
<text x="770" y="265" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#111111">Dato externo</text>
<text x="770" y="308" text-anchor="middle" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Color tostado</text>
<text x="770" y="328" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">Currículo oficial, solo</text>
<text x="770" y="344" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">referenciado (DBA, Evidencia).</text>
<circle cx="1000" cy="260" r="5" fill="#111111"/>
<line x1="1000" y1="260" x2="1140" y2="260" stroke="#555555" stroke-width="1.2"/>
<circle cx="1140" cy="260" r="5" fill="#111111"/>
<text x="1015" y="250" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#111111">1</text>
<text x="1125" y="250" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#111111">N</text>
<text x="1070" y="308" text-anchor="middle" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Números en la línea</text>
<text x="1070" y="328" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">Cuántas veces participa</text>
<text x="1070" y="344" text-anchor="middle" font-family="Helvetica" font-size="11.5" fill="#555555">cada entidad en la relación.</text>
</svg><p class="caption"></p></div>
</body></html>
