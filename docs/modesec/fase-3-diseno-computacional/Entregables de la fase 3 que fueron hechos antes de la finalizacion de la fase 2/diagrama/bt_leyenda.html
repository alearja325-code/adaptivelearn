<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body style="margin:0;padding:20px;background:#fff;">
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" font-family="Helvetica">
<rect x="0" y="0" width="720" height="600" fill="#F3F5F8" rx="20" ry="20" stroke="#E3E7ED"/>
<text x="30" y="36" font-family="Helvetica" font-size="15" font-weight="700" fill="#111111">LEYENDA</text>
<rect x="30" y="70" width="40" height="20" rx="3" ry="3" fill="#E7DEF7" stroke="#7E63B8" stroke-width="1.6"/>
<text x="85" y="80" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Entidad</text>
<text x="85" y="97" font-family="Helvetica" font-size="11.5" fill="#555555">Objeto que administramos, con sus atributos adentro.</text>
<rect x="30" y="132" width="40" height="20" rx="3" ry="3" fill="#FDF0D5" stroke="#C9922F" stroke-width="1.6"/>
<text x="85" y="142" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Entidad asociativa</text>
<text x="85" y="159" font-family="Helvetica" font-size="11.5" fill="#555555">Resuelve una relacion N a N -- la caja ES la relacion.</text>
<rect x="30" y="194" width="40" height="20" rx="3" ry="3" fill="#F5EFE0" stroke="#A98B4E" stroke-width="1.6"/>
<text x="85" y="204" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Dato externo del MEN</text>
<text x="85" y="221" font-family="Helvetica" font-size="11.5" fill="#555555">Curriculo oficial, solo referenciado por el sistema.</text>
<rect x="30" y="256" width="40" height="20" rx="3" ry="3" fill="#FADCE0" stroke="#C0637B" stroke-width="1.6"/>
<text x="85" y="266" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Entidad debil</text>
<text x="85" y="283" font-family="Helvetica" font-size="11.5" fill="#555555">Sin clave propia: la hereda de quien la identifica.</text>
<rect x="30" y="318" width="40" height="20" rx="3" ry="3" fill="#ECECEC" stroke="#8A8A8A" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="85" y="328" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Vista derivada</text>
<text x="85" y="345" font-family="Helvetica" font-size="11.5" fill="#555555">No persiste: se calcula cada vez que se consulta.</text>
<polygon points="50,390 72,402 50,414 28,402" fill="#DDF0DD" stroke="#5F9E5F" stroke-width="1.4"/>
<text x="85" y="398" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Relacion</text>
<text x="85" y="415" font-family="Helvetica" font-size="11.5" fill="#555555">Como se conectan dos entidades.</text>
<polygon points="50,433 76,446 50,459 24,446" fill="#DDF0DD" stroke="#5F9E5F" stroke-width="1.4"/>
<polygon points="50,438 70,446 50,454 30,446" fill="#DDF0DD" stroke="#5F9E5F" stroke-width="1.4"/>
<text x="85" y="453" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">Relacion identificadora</text>
<text x="85" y="470" font-family="Helvetica" font-size="11.5" fill="#555555">La que le da identidad a una entidad debil.</text>
<text x="30" y="510" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">PK / FK</text>
<text x="85" y="510" font-family="Helvetica" font-size="11.5" fill="#555555">Clave primaria / foranea -- "PK,FK" cuando es las dos.</text>
<text x="30" y="540" font-family="Helvetica" font-size="12.5" font-weight="700" fill="#111111">(U) / (derivado)</text>
<text x="150" y="540" font-family="Helvetica" font-size="11.5" fill="#555555">Valor unico / se calcula, no se guarda de forma independiente.</text>
</svg></body></html>
