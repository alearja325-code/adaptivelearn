<text x="1200" y="94" font-family="Helvetica" font-size="13" fill="#555555">participación parcial (0,N) — línea simple</text>
<text x="1200" y="224" font-family="Helvetica" font-size="13" fill="#555555">participación total (1,N) — línea doble</text>
<text x="1200" y="364" font-family="Helvetica" font-size="13" fill="#555555">elipse negra = llave primaria</text>
<text x="1200" y="422" font-family="Helvetica" font-size="13" fill="#555555">subrayado punteado = llave parcial de una entidad débil</text>
<text x="1200" y="480" font-family="Helvetica" font-size="13" fill="#555555">atributo</text>
<text x="1200" y="538" font-family="Helvetica" font-size="13" fill="#555555">elipse punteada = derivado</text>
<text x="950" y="570" font-family="Helvetica" font-size="13" fill="#555555">Las llaves foráneas no se dibujan: las produce el modelo relacional a partir de cada relación (H-8).</text>
<text x="700" y="154" font-family="Helvetica" font-size="13" fill="#555555">razón de cardinalidad — el tipo de la relación (1:1, 1:n, n:m)</text>
<text x="950" y="596" font-family="Helvetica" font-size="13" fill="#555555">elipse punteada = atributo derivado: «se guarda» (ADR-021) o «calculado» (no se guarda)</text>
<text x="950" y="622" font-family="Helvetica" font-size="13" fill="#555555">(mín, máx) junto a cada entidad = cuántas veces participa un ejemplar suyo en la relación</text>
<text x="950" y="648" font-family="Helvetica" font-size="13" fill="#555555">{xor} punteado entre dos relaciones = son excluyentes</text>
